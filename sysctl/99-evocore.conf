# EvoCore Runtime Sysctl Profile (swap55_tcp_v4)
# Designed for balanced general-purpose latency, zswap footprint, and loopback throughput
# without inflating socket buffers or starving background reclaim.

# Memory / Reclaim Balance
vm.swappiness = 55
vm.page-cluster = 0
vm.vfs_cache_pressure = 105
vm.compaction_proactiveness = 0
vm.watermark_boost_factor = 0

# Low-Jitter TCP & Netdev Budget (keeps default tcp_rmem/tcp_wmem to avoid cache thrashing)
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_backlog_ack_defer = 0
net.core.dev_weight = 128
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 4000
net.core.somaxconn = 4096
